spring.application.name=erp

# Servidor, puerto y nombre de la base de datos
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=MyERP;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=zero1234
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Configuraci\u00f3n de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
